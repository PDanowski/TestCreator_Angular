name: Backend .NET CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore ./TestCreator/TestCreator.sln

    - name: Build
      run: dotnet build ./TestCreator/TestCreator.sln --configuration Release --no-restore

    - name: Test
      run: dotnet test ./TestCreator/TestCreator.sln --configuration Release --no-build --verbosity normal
      
